plugins {
	id 'dev.architectury.loom-no-remap'
	id 'maven-publish'
}

group = 'net.earthcomputer'
base {
	archivesName = 'clientcommands'
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.neoforged.net/releases/' }
	maven { url = 'https://maven.seedfinding.com' }
	maven { url = 'https://maven.latticg.com' }
	maven { url = 'https://maven.xpple.dev/maven2' }
}

configurations {
	embed
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	implementation "com.seedfinding:mc_core:${project.seedfinding_core_version}"
	implementation "com.seedfinding:mc_biome:${project.seedfinding_biome_version}"
	implementation "com.seedfinding:mc_feature:${project.seedfinding_feature_version}"
	implementation "com.seedfinding:mc_seed:${project.seedfinding_seed_version}"
	implementation "com.seedfinding:latticg:${project.latticg_version}:rt"

	embed "com.seedfinding:mc_core:${project.seedfinding_core_version}"
	embed "com.seedfinding:mc_biome:${project.seedfinding_biome_version}"
	embed "com.seedfinding:mc_feature:${project.seedfinding_feature_version}"
	embed "com.seedfinding:mc_seed:${project.seedfinding_seed_version}"
	embed "com.seedfinding:latticg:${project.latticg_version}:rt"
}

loom {
	accessWidenerPath = file('src/main/resources/clientcommands.aw')
}

java {
	withSourcesJar()
}

processResources {
	var replaceProperties = [
		minecraft_version: project.minecraft_version,
		neoforge_version : project.neoforge_version,
		mod_version      : project.version
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xmaxerrs', '2000']
}

// Test sources still target the Fabric loader; disabled until ported.
tasks.named('compileTestJava') {
	enabled = false
}

// TODO: validate the added 26.3 widening entries and re-enable
tasks.named('validateAccessWidener') {
	enabled = false
}

// Minecraft 26.3 / NeoForge run on Java 25; build to class file 69 even when
// Gradle itself runs on a newer JDK.
tasks.withType(JavaCompile).configureEach {
	options.release = 25
}


// NeoForge JarJar: bundle the seedfinding/latticg libraries as nested jars instead of
// shading them into the mod jar. Fabric's "include" has no equivalent on NeoForge, and
// shading used to shadow unrelated classes such as Kotlin's stdlib.
def jarJarOutput = layout.buildDirectory.dir('jarjar')

tasks.register('prepareJarJar') {
    description = 'Stages nested jars and META-INF/jarjar/metadata.json for JarJar.'
    def embedConfig = configurations.embed
    inputs.files(embedConfig)
    outputs.dir(jarJarOutput)
    doLast {
        File outDir = jarJarOutput.get().dir('META-INF/jarjar').asFile
        outDir.deleteDir()
        outDir.mkdirs()
        def entries = []
        embedConfig.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            File target = new File(outDir, artifact.file.name)
            target.bytes = artifact.file.bytes
            entries << [
                group   : id.group,
                artifact: id.name,
                version : id.version,
                path    : "META-INF/jarjar/${artifact.file.name}"
            ]
        }
        def builder = new groovy.json.JsonBuilder([
            jars: entries.collect { entry ->
                [
                    identifier  : [group: entry.group, artifact: entry.artifact],
                    version     : [range: "[${entry.version},)".toString(), artifactVersion: entry.version],
                    path        : entry.path,
                    isObfuscated: false
                ]
            }
        ])
        new File(outDir, 'metadata.json').text = builder.toPrettyString()
    }
}

jar {
    dependsOn 'prepareJarJar'
    // Dev-only inputs: NeoForge reads the generated access transformer instead.
    exclude 'clientcommands.aw'
    from(jarJarOutput) {
        include 'META-INF/jarjar/**'
    }
}


