plugins {
	id 'dev.architectury.loom-no-remap'
	id 'maven-publish'
}

group = 'net.earthcomputer'
base {
	archivesName = 'clientcommands'
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.neoforged.net/releases/' }
	maven { url = 'https://maven.seedfinding.com' }
	maven { url = 'https://maven.latticg.com' }
	maven { url = 'https://maven.xpple.dev/maven2' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	compileOnly "com.seedfinding:mc_core:${project.seedfinding_core_version}"
	compileOnly "com.seedfinding:mc_biome:${project.seedfinding_biome_version}"
	compileOnly "com.seedfinding:mc_feature:${project.seedfinding_feature_version}"
	compileOnly "com.seedfinding:mc_seed:${project.seedfinding_seed_version}"
	compileOnly "com.seedfinding:latticg:${project.latticg_version}"
}

loom {
	accessWidenerPath = file('src/main/resources/clientcommands.aw')
}

java {
	withSourcesJar()
}

processResources {
	var replaceProperties = [
		minecraft_version: project.minecraft_version,
		neoforge_version : project.neoforge_version,
		mod_version      : project.version
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xmaxerrs', '2000']
}

// Test sources still target the Fabric loader; disabled until ported.
tasks.named('compileTestJava') {
	enabled = false
}

// TODO: validate the added 26.3 widening entries and re-enable
tasks.named('validateAccessWidener') {
	enabled = false
}

// Minecraft 26.3 / NeoForge run on Java 25; build to class file 69 even when
// Gradle itself runs on a newer JDK.
tasks.withType(JavaCompile).configureEach {
	options.release = 25
}
