plugins {
	id 'java'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.148'
}

group = 'net.earthcomputer'
base {
	archivesName = 'clientcommands'
}
version = project.version

repositories {
	mavenCentral()
	maven { url = 'https://maven.seedfinding.com' }
	maven { url = 'https://maven.latticg.com' }
	maven { url = 'https://maven.xpple.dev/maven2' }
}

neoForge {
	version = project.neoforge_version

	// NeoForge reads the access transformer from the mod jar at runtime; declaring it here also
	// makes it available in the development environment.
	accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

	runs {
		client {
			client()
			systemProperty 'neoforge.enabledGameTestNamespaces', 'clientcommands'
		}
		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', 'clientcommands'
		}
	}

	mods {
		clientcommands {
			sourceSet sourceSets.main
		}
	}

	unitTest {
		enable()
		testedMod = mods.clientcommands
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

dependencies {
	implementation "com.seedfinding:mc_core:${project.seedfinding_core_version}"
	implementation "com.seedfinding:mc_biome:${project.seedfinding_biome_version}"
	implementation "com.seedfinding:mc_feature:${project.seedfinding_feature_version}"
	implementation "com.seedfinding:mc_seed:${project.seedfinding_seed_version}"
	implementation "com.seedfinding:latticg:${project.latticg_version}:rt"

	jarJar "com.seedfinding:mc_core:${project.seedfinding_core_version}"
	jarJar "com.seedfinding:mc_biome:${project.seedfinding_biome_version}"
	jarJar "com.seedfinding:mc_feature:${project.seedfinding_feature_version}"
	jarJar "com.seedfinding:mc_seed:${project.seedfinding_seed_version}"
	jarJar "com.seedfinding:latticg:${project.latticg_version}:rt"
	// Transitive seedfinding dependencies must be declared explicitly: JarJar validates that every
	// embedded jar has Maven coordinates (a bare file dependency has none).
	jarJar "com.seedfinding:mc_math:1.171.0"
	jarJar "com.seedfinding:mc_noise:1.171.1"
	jarJar "com.seedfinding:mc_terrain:1.171.1"
	jarJar "net.lecousin.compression:gzip:0.1.10"
	jarJar "net.lecousin.compression:deflate:0.1.10"
	jarJar "net.lecousin:core:0.20.0"
	jarJar "org.jetbrains:annotations:13.0"
	// The seedfinding libraries are compiled against Kotlin; NeoForge's JarJar selector will pick a
	// single kotlin-stdlib if the pack already ships KotlinLangForge.
	jarJar "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
	jarJar "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"
	jarJar "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0"
}

processResources {
	var replaceProperties = [
		minecraft_version: project.minecraft_version,
		neoforge_version : project.neoforge_version,
		mod_version      : project.version
	]
	inputs.properties replaceProperties
	filesMatching('META-INF/neoforge.mods.toml') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.3 and NeoForge run on Java 25; build class file 69 even on a newer JDK.
	options.release = 25
	options.compilerArgs += ['-Xmaxerrs', '2000']
	options.encoding = 'UTF-8'
}


dependencies {
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.ow2.asm:asm:9.8"
	testImplementation "org.ow2.asm:asm-tree:9.8"
	testImplementation "org.ow2.asm:asm-analysis:9.8"
	testImplementation "org.ow2.asm:asm-util:9.8"
	testImplementation "org.apache.commons:commons-lang3:3.17.0"
	testImplementation "com.code-intelligence:jazzer-junit:0.30.0"
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'clientcommands.regressionTestDir', file('regressionTests').absolutePath
}

// NFRT tasks default to a Java 21 toolchain; the project targets Java 25 and a 21 JDK is not
// necessarily installed, so point them at the project toolchain instead.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
	javaExecutable.set(providers.provider {
		javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.get()
			.executablePath.asFile.absolutePath
	})
}
